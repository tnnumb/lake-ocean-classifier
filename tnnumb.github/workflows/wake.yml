name: Keep Streamlit app awake

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (Streamlit sleeps after 12 hours without visitors)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit the app and click the wake-up button if it is asleep
        env:
          APP_URL: https://lake-ocean-classifier-glc7ome7lwcokmzq2vg6wj.streamlit.app/
        run: |
          python - <<'EOF'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=120_000)
              page.wait_for_timeout(8000)
              button = page.get_by_role("button", name="Yes, get this app back up!")
              if button.count() > 0:
                  print("App was asleep. Clicking the wake-up button...")
                  button.first.click()
                  page.wait_for_timeout(90_000)   # give it time to start
              else:
                  print("App is awake.")
              browser.close()
          EOF
